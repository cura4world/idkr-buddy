name: Map photos (지도 사진 고정 목록 만들기)

# 작업 환경(클라우드 세션)에서는 위키미디어 접속이 막혀 있어, 인터넷이 되는 Actions 러너에서
# scripts/build-map-photos.mjs 를 돌려 src/lib/mapPhotos.ts 를 채웁니다.
# 결과는 release/public 에 커밋하고, 눈으로 확인할 HTML 은 실행 결과(artifact)로 올립니다.
# main 에는 쓰지 않습니다.

# 손으로 돌릴 때만 실행합니다(Actions 화면의 Run workflow). 예전에는 스크립트나 이 파일을 push 하면 저절로 돌아
# 85곳 사진을 사람 확인 없이 다시 골라 커밋했습니다 — 사진은 사람이 한 장씩 확인한 것이라 저절로 바뀌면 안 됩니다
# (2026-11-14 2차 때 한 번 돌기 시작해 바로 취소함).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-photos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/public

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build photo list
        run: |
          set -o pipefail
          node scripts/build-map-photos.mjs 2>&1 | tee photo-build.log
          # find 는 읽을 수 없는 폴더가 있으면 0 이 아닌 값을 돌려줘, pipefail 아래에서 단계가 멈췄습니다(2026-11-11).
          REVIEW=$(find /tmp -maxdepth 2 -name 'map-photos-review.html' 2>/dev/null | head -1 || true)
          if [ -n "$REVIEW" ]; then cp "$REVIEW" map-photos-review.html; fi

      - name: Review page (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-photos-review
          path: |
            map-photos-review.html
            photo-build.log
            src/lib/mapPhotos.ts
          if-no-files-found: warn

      - name: Commit photo list
        run: |
          if git diff --quiet -- src/lib/mapPhotos.ts; then
            echo "mapPhotos.ts 바뀐 것 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mapPhotos.ts
          git commit -m "지도: 사진 고정 목록 채움 (Actions 에서 위키미디어 조회)"
          # 조회하는 동안(약 25분) 브랜치가 앞서 나가면 push 가 거절되므로, 받아서 다시 올립니다(최대 3번).
          for i in 1 2 3; do
            git pull --rebase origin release/public && git push origin HEAD:release/public && exit 0
            sleep 10
          done
          exit 1
