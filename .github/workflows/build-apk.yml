name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/manifest.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Restore signing keystore from secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Download app icon
        run: |
          curl -sL "https://cura4world.github.io/idkr-buddy/icon-512x512.png" -o icon-original.png
          sudo apt-get install -y imagemagick -q
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert icon-original.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon-original.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon-original.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon-original.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon-original.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # ── 적응형 아이콘 (안드로이드 8 이상) ──────────────────────
          # 이게 없으면 시스템이 레거시로 처리해 25% 축소 + 흰 배경을 깐다.
          # 배경은 단색 청록, 전경은 연필만. 전경은 108dp 캔버스 안쪽 72dp 안에 들어가 있다.
          test -f public/icon-foreground-432.png || { echo "public/icon-foreground-432.png 이 없습니다"; exit 1; }
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          convert public/icon-foreground-432.png -resize 108x108 app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert public/icon-foreground-432.png -resize 162x162 app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert public/icon-foreground-432.png -resize 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert public/icon-foreground-432.png -resize 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp public/icon-foreground-432.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cat > app/src/main/res/values/ic_launcher_background.xml << 'ICONXML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#37C0D2</color>
          </resources>
          ICONXML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ICONXML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          ICONXML

      - name: Create WebView Android project
        run: |
          mkdir -p app/src/main/java/io/github/cura4world/twa
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KataKata"
          include ':app'
          GRADLE

          cat > build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          GRADLE

          cat > gradle.properties << 'GRADLE'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          GRADLE

          cat > app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
          }

          // 빌드할 때마다 versionCode를 올려야 폰에서 업데이트 설치가 됩니다.
          // GitHub Actions의 실행 번호를 사용하고, 로컬 빌드 등에서는 1을 씁니다.
          def runNumber = System.getenv('GITHUB_RUN_NUMBER')
          def appVersionCode = runNumber ? runNumber.toInteger() : 1

          android {
              namespace 'io.github.cura4world.twa'
              compileSdk 34
              defaultConfig {
                  applicationId 'io.github.cura4world.twa'
                  minSdk 21
                  targetSdk 34
                  versionCode appVersionCode
                  versionName '1.0.' + appVersionCode
              }
              signingConfigs {
                  release {
                      storeFile file('../keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE

          cat > gradle/wrapper/gradle-wrapper.properties << 'GRADLE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          GRADLE

          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -o gradlew
          chmod +x gradlew
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kata kata</string>
          </resources>
          XML

          cat > app/src/main/java/io/github/cura4world/twa/MainActivity.java << 'JAVA'
          package io.github.cura4world.twa;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.os.Environment;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.MotionEvent;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView webView;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int MIC_REQUEST = 1002;
              private PermissionRequest pendingPermissionRequest;

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != MIC_REQUEST) return;
                  PermissionRequest req = pendingPermissionRequest;
                  pendingPermissionRequest = null;
                  if (req == null) return;
                  boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (granted) {
                      req.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  } else {
                      req.deny();
                  }
              }

              private class TTSInterface {
                  @JavascriptInterface
                  public void speak(String text, String langCode) {
                      if (!ttsReady) return;
                      Locale locale;
                      if (langCode.startsWith("ko")) {
                          locale = Locale.KOREAN;
                      } else if (langCode.startsWith("id")) {
                          locale = new Locale("id", "ID");
                      } else {
                          locale = Locale.getDefault();
                      }
                      int result = tts.setLanguage(locale);
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts.setLanguage(Locale.getDefault());
                      }
                      tts.setSpeechRate(0.9f);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "tts_" + System.currentTimeMillis());
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (ttsReady) tts.stop();
                  }

                  @JavascriptInterface
                  public boolean isReady() {
                      return ttsReady;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true;
                      }
                  });

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new TTSInterface(), "AndroidTTS");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("https://cura4world.github.io/idkr-buddy")) {
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  boolean wantsAudio = false;
                                  String[] resources = request.getResources();
                                  for (int i = 0; i < resources.length; i++) {
                                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resources[i])) {
                                          wantsAudio = true;
                                      }
                                  }
                                  if (!wantsAudio) {
                                      request.deny();
                                      return;
                                  }
                                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) {
                                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                                      return;
                                  }
                                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                                  } else {
                                      pendingPermissionRequest = request;
                                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, MIC_REQUEST);
                                  }
                              }
                          });
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition,
                              String mimeType, long contentLength) {
                          startDownload(url, contentDisposition, mimeType);
                      }
                  });

                  // 시스템이 액티비티를 다시 만든 경우(폴드 펼침·메모리 회수 등)에는 보던 화면을 되살립니다.
                  // 사용자가 최근 앱에서 직접 밀어 종료하면 안드로이드가 이 상태를 폐기하므로
                  // 다음 실행은 자연히 첫 화면이 됩니다.
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("https://cura4world.github.io/idkr-buddy/");
                  }
                  setContentView(webView);
              }

              // ── S펜 옆 버튼 ────────────────────────────────────────
              // 웹뷰는 옆 버튼 상태를 웹 페이지에 넘기지 않습니다(탭에서 확인).
              // 네이티브에서 읽어 웹으로 알려 줍니다. 상태가 바뀔 때만 부르므로
              // 매 터치마다 자바스크립트를 실행하지 않습니다.
              private boolean penButtonDown = false;

              private void reportPenButton(MotionEvent ev) {
                  if (ev == null || webView == null) return;
                  if (ev.getToolType(0) != MotionEvent.TOOL_TYPE_STYLUS) return;
                  int mask = MotionEvent.BUTTON_STYLUS_PRIMARY
                          | MotionEvent.BUTTON_STYLUS_SECONDARY
                          | MotionEvent.BUTTON_SECONDARY;
                  final boolean down = (ev.getButtonState() & mask) != 0;
                  if (down == penButtonDown) return;
                  penButtonDown = down;
                  final String js = "window.__penBtn && window.__penBtn(" + (down ? "true" : "false") + ")";
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (webView != null) {
                              webView.evaluateJavascript(js, null);
                          }
                      }
                  });
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent ev) {
                  reportPenButton(ev);
                  return super.dispatchTouchEvent(ev);
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent ev) {
                  reportPenButton(ev);
                  return super.dispatchGenericMotionEvent(ev);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              // 백업 파일 등을 폰의 다운로드 폴더에 저장합니다.
              // data: URL 은 DownloadManager 가 처리하지 못하므로 직접 파일로 씁니다.
              private void startDownload(String url, String contentDisposition, String mimeType) {
                  try {
                      String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      if (url != null && url.startsWith("data:")) {
                          saveDataUrl(url, name);
                          return;
                      }
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setMimeType(mimeType);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      dm.enqueue(req);
                      toast("다운로드 폴더에 저장합니다: " + name);
                  } catch (Exception e) {
                      toast("저장하지 못했습니다");
                  }
              }

              // blob: URL 은 자바스크립트 쪽에서 data: URL 로 바꿔 내려보내는 것을 전제로 합니다.
              private void saveDataUrl(String url, String name) {
                  java.io.FileOutputStream out = null;
                  try {
                      int comma = url.indexOf(',');
                      if (comma < 0) {
                          toast("저장하지 못했습니다");
                          return;
                      }
                      String meta = url.substring(0, comma);
                      String payload = url.substring(comma + 1);
                      byte[] bytes;
                      if (meta.contains(";base64")) {
                          bytes = Base64.decode(payload, Base64.DEFAULT);
                      } else {
                          bytes = Uri.decode(payload).getBytes("UTF-8");
                      }
                      java.io.File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) {
                          dir.mkdirs();
                      }
                      java.io.File file = new java.io.File(dir, name);
                      out = new java.io.FileOutputStream(file);
                      out.write(bytes);
                      out.flush();
                      toast("다운로드 폴더에 저장했습니다: " + name);
                  } catch (Exception e) {
                      toast("저장하지 못했습니다");
                  } finally {
                      if (out != null) {
                          try {
                              out.close();
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }

              private void toast(final String message) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, message, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (fileCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kata-kata-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/*.apk kata-kata.apk

      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kata kata APK
          body: |
            Kata kata 인도네시아어-한국어 단어장 앱 (최신 빌드)
            설치: APK를 열고 '출처를 알 수 없는 앱' 설치를 허용하세요.
          files: kata-kata.apk
          make_latest: true
