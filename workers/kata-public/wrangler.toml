# kata-public — Kata kata 공개판 서버
# 대시보드에 worker.js 를 붙여 넣어 배포해도 됩니다. 그때는 아래 값을 대시보드 설정에서 똑같이 넣습니다.
# 비밀값(AI_PROXY_URL, PROXY_SECRET, PLAY_SERVICE_ACCOUNT, ADMIN_KEY)은 이 파일에 쓰지 않습니다.
#   npx wrangler secret put AI_PROXY_URL
#   npx wrangler secret put PROXY_SECRET
#   npx wrangler secret put PLAY_SERVICE_ACCOUNT
#   npx wrangler secret put ADMIN_KEY
# (선택) 신고 알림 — 둘 다 있을 때만 텔레그램으로 알립니다.
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#
# ⚠ 이 파일로 `npx wrangler deploy` 를 하면 아래 [vars] 값이 대시보드에 넣어 둔 변수를 덮어씁니다(비밀값은 덮어쓰지 않습니다).
#   2026-11-14: GOOGLE_WEB_CLIENT_ID·AI_DAILY_BUDGET 은 채웠습니다. **KV id 한 칸만** 채우면 배포할 수 있습니다.
#   따라 하는 순서는 docs/release/08-cloudflare-deploy.md.

name = "kata-public"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# 웹 OAuth 클라이언트 ID (Google Cloud 프로젝트 Kata-kata, 2026-11-14). 비밀값이 아닙니다 — 앱에도 같은 값이 들어갑니다
# (GitHub 변수 STORE_WEB_CLIENT_ID 와 같아야 로그인이 됩니다). 여러 개면 쉼표로.
GOOGLE_WEB_CLIENT_ID = "228056729729-kalemfhdg394bgo2mft16g5asnin21gd.apps.googleusercontent.com"
PLAY_PACKAGE = "app.naruve.katakata"
PRODUCT_IDS = "plus"
# 한도를 바꾸려면 이 값만 고칩니다. 비워 두면 worker.js 의 DEFAULT_LIMITS(결정 문서 표)를 씁니다.
# 적은 칸만 바뀝니다. 예: {"plus":{"story":{"day":6,"month":70}},"trial":{"longread":{"total":20}},"free":{"tts":0}}
#   숫자 하나는 하루 상한, null 은 그 기간 제한 없음, "locked":true 는 그 등급에서 잠금.
LIMITS_JSON = ""
# 전체 하루 상한 — 하루(한국 날짜)에 AI 쪽으로 나가는 호출 수. 비우면 상한 없음.
#   "5000"  또는  {"all":5000,"tts":2000}  (소리만 따로 더 낮게). 권장값과 계산법은 docs/release/05-arga-checklist.md 4절.
#   잘못 적으면 0 으로 보고 모두 막습니다 — 넣은 뒤 GET /admin/budget 으로 확인.
#   시작값(2026-11-14): 전체 3,000 · 소리 1,000.
AI_DAILY_BUDGET = '{"all":3000,"tts":1000}'

[[kv_namespaces]]
binding = "PUBLIC_KV"
# ⬇ 아직 없는 값(자리표시자). `npx wrangler kv namespace create PUBLIC_KV` 로 만든 뒤 나온 id(32자)로 바꿉니다.
#   이 글자 그대로 두면 배포가 실패합니다(일부러 그렇게 둠 — 빈 KV 로 배포되는 일을 막음). id 는 비밀값이 아닙니다.
id = "REPLACE_WITH_PUBLIC_KV_ID"

# 사용량 카운터 — Durable Object (동시 요청에도 정확히 셈, 전체 하루 상한도 여기서 셈).
# 무료 요금제에서 쓸 수 있는 SQLite 방식입니다. 이 바인딩이 없으면 서버는 예전처럼 KV 로 셉니다.
# Durable Object 클래스는 대시보드에 코드를 붙여 넣는 것만으로는 만들어지지 않습니다 — `npx wrangler deploy` 가 필요합니다.
[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# 매시간 한 번 — 한 시간 넘게 묵은 신고 알림 묶음을 보냅니다(텔레그램 비밀값이 없으면 아무것도 하지 않음).
[triggers]
crons = ["17 * * * *"]
